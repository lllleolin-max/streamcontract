[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "streamcontract"
version = "0.2.1"
description = "Bounded event-time JSONL contracts with resumable aggregate evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lllleolin-max"}]
keywords = ["data-contract", "jsonl", "event-time", "checkpoint"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
streamcontract = "streamcontract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
